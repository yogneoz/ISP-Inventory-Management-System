<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Management System</title>
    <!-- Paint-time theme mirror: DarkModeContext owns the authoritative value
         (user_preferences) and reads the same key. Setting the class here, from
         a same-origin file, avoids a light boot flash for dark-mode users and
         stays inside the production CSP (inline scripts are not allowed). -->
    <script src="/boot-theme.js"></script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #e9ebee;
      }

      html.dark body {
        background: #0a0c10;
      }

      /* The document is visible before the React bundle is parsed. Without this
         static paint the browser shows a blank white page (recorded at ~600 ms
         on a reload), then the shell's own spinner. The splash sits OUTSIDE
         #root and is removed by main.tsx only once the saved tab's screen has
         committed, so a lazy screen's "Loading module…" fallback is never
         visible. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #e9ebee;
        color: #64748b;
        font: 600 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      html.dark #boot-splash {
        background: #0a0c10;
        color: #94a3b8;
      }

      #boot-splash .boot-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgb(99 102 241 / 0.22);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }

      #boot-splash p {
        margin: 0;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-spinner" aria-hidden="true"></div>
      <p>Synchronizing inventory database…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
