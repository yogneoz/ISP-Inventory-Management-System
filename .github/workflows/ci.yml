name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    # A bound on the whole job. Without it a wedged step burns the GitHub
    # default (360 minutes) per push: the suite sat in the npm test step for 86
    # minutes with every test green, because the lifecycle process tests left
    # node's runner unable to exit (fixed in tests/lifecycleProcess.test.ts).
    # 30 minutes is ~6x the real runtime (measured: ~5 min here), so this can
    # only ever fire on a genuine hang — where a fast, visible failure beats six
    # hours of nothing.
    timeout-minutes: 30

    # PostgreSQL service container: lets the DB-dependent integration tests
    # run in CI instead of skipping (real-PG concurrency proofs, schema drift
    # guard, authenticated positive-path HTTP tests). The credentials must
    # match DATABASE_URL below. Tests only run against throwaway databases
    # (inventory_concurrency_test etc.) or read information_schema — the app
    # database is created here but never modified by the suite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inventory_user
          POSTGRES_PASSWORD: securepassword
          POSTGRES_DB: inventory_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_user -d inventory_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://inventory_user:securepassword@localhost:5432/inventory_db

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply schema.sql to the CI database (fresh-install proof + drift-guard baseline)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/schema.sql
      # Duplication-audit phase 2 runtime proof: boots the real server against
      # an EMPTY throwaway database (dbBoot executes scripts/schema.sql itself)
      # and diffs the resulting runtime schema against a reference database
      # created by applying scripts/schema.sql directly. Catches runtime DDL
      # that re-inlines a second schema outside scripts/schema.sql on every
      # push. Requires CREATEDB — the CI service superuser has it.
      - name: Fresh-install proof — boot server on empty DB and assert schema parity
        run: node scripts/verify_fresh_install.mjs
      - run: npx tsc --noEmit
      # npm test includes the live graceful-drain check
      # (tests/lifecycleLiveDrain.test.ts). It creates its own throwaway database
      # (inventory_drain_test), boots the REAL entry (server/index.ts) against it,
      # sends a real SIGTERM while an authenticated request is genuinely in flight
      # and asserts that response completes and the process exits 0 by itself.
      # Like the concurrency tests it needs CREATEDB — which the service
      # superuser has — and it never touches the application database.
      #
      # LIVE_DRAIN_REQUIRE_REAL_SIGNAL=1 turns the check's skips into failures:
      # this job is the only place the real-signal drain is proven, so a runner
      # image without POSIX signals, a missing service container or a user
      # without CREATEDB must fail the build rather than leave the proof as a
      # green no-op. (Skipping stays normal for local/dev runs, which do not
      # set the variable.)
      - run: npm test
        env:
          LIVE_DRAIN_REQUIRE_REAL_SIGNAL: '1'
      - name: Enforce repo-layer convention (no raw SQL in controllers)
        run: npm run check:no-inline-sql
      # The window.alert monkey-patch was removed when all ~100 raw call
      # sites migrated to useDialog(); this keeps new native dialog calls
      # from creeping back in (see scripts/check_no_raw_dialogs.ts).
      - name: Enforce dialog convention (no native alert/confirm/prompt in client)
        run: npm run check:no-raw-dialogs
      # Backlog #7: CI previously never built the frontend or audited
      # dependencies, so a bundling-only type error or a newly-advised
      # dependency could reach main undetected.
      - name: Build client + server production bundles
        run: npm run build
      # Startup-budget gate: computes the transitive static-import closure of
      # index.html's entry chunk and fails if the entry chunk or the whole
      # eager graph exceeds its gzip budget — so a screen accidentally re-added
      # to the eager imports or a shared module merged into the wrong chunk
      # (see scripts/check_bundle_budget.mjs for the incident) fails CI.
      - name: Enforce startup bundle size budget
        run: npm run check:bundle-budget
      # npm audit exits non-zero when vulnerabilities are found; gating on
      # --omit=dev covers the deployable dependency surface (dev tooling
      # advisories are surfaced in local audits but do not block the build).
      - name: Fail on npm audit vulnerabilities (production deps)
        run: npm audit --omit=dev
